name: signal
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test or compare"
        default: "test"
        type: choice
        options:
          - test
          - compare
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        symbol: [XAUUSD, BTCUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - run: python bot.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TD_KEY: ${{ secrets.TD_KEY }}
          SYMBOL: ${{ matrix.symbol }}
          MODE: ${{ github.event.inputs.mode || 'signal' }}
      - name: save state
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state_*.json || true
          if ! git diff --cached --quiet; then
            git commit -m "update state"
            for i in 1 2 3 4; do
              git pull --rebase && git push && break
              sleep 5
            done
          fi
